<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#062b17" />
    <meta
      name="description"
      content="Ten Play 9/6 Jacks or Better video poker trainer and simulator."
    />
    <title>Ten Play Video Poker</title>
    <link rel="stylesheet" href="./styles.css?v=rich-ui-1" />
    <style>
      /* Keep card-state contrast strong on small Safari displays. */
      .card.is-held {
        border-color: #ffe36b;
        box-shadow:
          inset 0 0 0 2px rgba(255, 227, 107, 0.6),
          0 0 0 4px rgba(242, 201, 76, 0.85),
          0 0 16px 7px rgba(242, 201, 76, 0.72),
          0 0 38px 14px rgba(242, 201, 76, 0.5);
        z-index: 2;
      }

      .card.is-winning {
        border-color: #67ff9f;
        box-shadow:
          inset 0 0 0 2px rgba(103, 255, 159, 0.65),
          0 0 0 4px rgba(65, 220, 122, 0.9),
          0 0 18px 8px rgba(65, 220, 122, 0.78),
          0 0 42px 16px rgba(65, 220, 122, 0.55);
        z-index: 3;
      }

      /* Match the stronger green win treatment in the nine secondary hands. */
      .result-card.is-winning {
        position: relative;
        border-color: #67ff9f;
        box-shadow:
          inset 0 0 0 1px rgba(103, 255, 159, 0.7),
          0 0 0 2px rgba(65, 220, 122, 0.9),
          0 0 9px 3px rgba(65, 220, 122, 0.75),
          0 0 18px 6px rgba(65, 220, 122, 0.48);
        z-index: 2;
      }

      /* The first outcome is already displayed as the large main hand above. */
      .result-grid .result-hand:first-child {
        display: none;
      }

      /* Branded masthead: compact enough to preserve the portrait no-scroll layout. */
      .brand-logo {
        display: block;
        width: min(100%, 28rem);
        max-height: clamp(4.4rem, 12svh, 7.2rem);
        object-fit: contain;
        filter:
          drop-shadow(0 0 8px rgba(87, 255, 99, 0.22))
          drop-shadow(0 0 14px rgba(242, 201, 76, 0.24));
      }

      .brand-title {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .masthead .eyebrow {
        margin-bottom: -0.2rem;
      }

      /* Rich casino-surface treatment: same structure, stronger visual hierarchy. */
      body {
        background:
          radial-gradient(circle at 50% -10%, rgba(77, 255, 112, 0.2), transparent 28rem),
          radial-gradient(circle at 50% 45%, rgba(20, 120, 62, 0.24), transparent 34rem),
          linear-gradient(150deg, #07361d, #03190e 72%);
      }

      .meter-bar,
      .machine,
      .suggestion,
      .result-hand {
        border-color: rgba(255, 221, 84, 0.34);
      }

      .meter-bar {
        background:
          linear-gradient(180deg, rgba(255,255,255,0.04), transparent),
          rgba(0, 18, 8, 0.58);
        box-shadow:
          inset 0 0 0 1px rgba(77, 255, 112, 0.06),
          0 0 20px rgba(77, 255, 112, 0.08);
      }

      .meter-value {
        color: #fff4b6;
        text-shadow: 0 0 12px rgba(255, 214, 71, 0.22);
      }

      .machine {
        background:
          radial-gradient(circle at 50% 0%, rgba(58, 173, 92, 0.16), transparent 22rem),
          linear-gradient(180deg, rgba(255,255,255,0.035), transparent 35%),
          #0a3c22;
        box-shadow:
          0 18px 55px rgba(0, 0, 0, 0.42),
          inset 0 0 0 1px rgba(255, 214, 71, 0.12),
          inset 0 1px rgba(255, 255, 255, 0.08);
      }

      .mode-switch {
        border-color: rgba(255, 221, 84, 0.45);
        background: linear-gradient(180deg, rgba(0, 22, 10, 0.9), rgba(0, 10, 5, 0.82));
        box-shadow:
          inset 0 0 0 1px rgba(77, 255, 112, 0.08),
          0 0 14px rgba(77, 255, 112, 0.1);
      }

      .mode-button {
        transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }

      .mode-button.is-active {
        background: linear-gradient(180deg, #fff1a0, #e9b72f);
        color: #1a1300;
        box-shadow:
          inset 0 1px rgba(255,255,255,0.65),
          0 0 0 1px rgba(255, 213, 72, 0.9),
          0 0 16px rgba(255, 199, 55, 0.32);
      }

      .coin-button {
        border-color: rgba(93, 255, 122, 0.25);
        background: linear-gradient(180deg, rgba(8, 76, 39, 0.96), rgba(2, 39, 20, 0.96));
        color: #d6e7d8;
        box-shadow:
          inset 0 1px rgba(255,255,255,0.05),
          inset 0 -10px 20px rgba(0,0,0,0.14);
      }

      .coin-button.is-active {
        border-color: #ffdb58;
        background: linear-gradient(180deg, #ffe67c, #eab328 72%, #cb8d12);
        color: #261900;
        box-shadow:
          inset 0 1px rgba(255,255,255,0.68),
          0 0 0 2px rgba(112, 255, 119, 0.32),
          0 0 18px rgba(255, 204, 54, 0.4);
        transform: translateY(-1px);
      }

      .deal-button {
        border: 1px solid #ffdb58;
        background:
          linear-gradient(180deg, #fff08c 0%, #ffc933 38%, #e9a414 100%);
        color: #201400;
        letter-spacing: 0.02em;
        text-shadow: 0 1px rgba(255,255,255,0.35);
        box-shadow:
          inset 0 2px rgba(255,255,255,0.58),
          inset 0 -8px 16px rgba(150, 82, 0, 0.14),
          0 0 0 2px rgba(70, 255, 105, 0.2),
          0 8px 20px rgba(0,0,0,0.28),
          0 0 22px rgba(255, 198, 40, 0.22);
      }

      .secondary-button {
        border-color: rgba(87, 255, 108, 0.42);
        background: linear-gradient(180deg, rgba(8, 70, 36, 0.96), rgba(2, 35, 18, 0.96));
        color: #dff8e1;
        box-shadow:
          inset 0 1px rgba(255,255,255,0.05),
          0 0 14px rgba(65, 220, 122, 0.08);
      }

      .status-panel {
        border-color: rgba(255, 221, 84, 0.28);
        background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.12), transparent);
      }

      .status-panel strong {
        color: #fff5c7;
        text-shadow: 0 0 12px rgba(255, 213, 72, 0.18);
      }

      .suggestion {
        background: linear-gradient(180deg, rgba(17, 86, 47, 0.9), rgba(8, 57, 31, 0.92));
        box-shadow: inset 0 1px rgba(255,255,255,0.035);
      }

      .suggestion.is-best {
        border-color: #ffdb58;
        background:
          linear-gradient(90deg, rgba(255, 209, 60, 0.11), transparent 24%),
          linear-gradient(180deg, rgba(22, 91, 49, 0.94), rgba(8, 56, 30, 0.94));
        box-shadow:
          inset 0 0 0 1px rgba(255, 221, 84, 0.16),
          0 0 18px rgba(255, 207, 53, 0.15);
      }

      .result-hand {
        background:
          linear-gradient(180deg, rgba(13, 70, 38, 0.78), rgba(3, 35, 18, 0.86));
        box-shadow:
          inset 0 1px rgba(255,255,255,0.035),
          0 6px 14px rgba(0,0,0,0.14);
      }

      @media (max-width: 600px) and (orientation: portrait) {
        .brand-logo {
          width: min(94vw, 22rem);
          max-height: 5.4rem;
        }

        .masthead {
          gap: 0.2rem;
          padding-bottom: 0.65rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <header class="masthead">
        <p class="eyebrow">9/6 Jacks or Better</p>
        <h1 id="app-title" class="brand-title">Vig Wire Labs 10 Play Video Poker</h1>
        <img
          class="brand-logo"
          src="./assets/branding/ten-play/logo-primary-wide.png"
          alt="Vig Wire Labs 10 Play Video Poker"
        />
        <div class="mode-switch" role="group" aria-label="Display mode">
          <button type="button" class="mode-button is-active" data-mode="trainer">Trainer</button>
          <button type="button" class="mode-button" data-mode="casino">Casino</button>
        </div>
      </header>

      <section class="meter-bar" aria-label="Session totals">
        <div>
          <span class="meter-label">Credits</span>
          <strong id="credits" class="meter-value">1,000</strong>
        </div>
        <div>
          <span class="meter-label">Session RTP</span>
          <strong id="rtp" class="meter-value">0.0%</strong>
        </div>
        <div class="meter-detail">
          <span>In <b id="total-in">0</b></span>
          <span>Out <b id="total-out">0</b></span>
        </div>
      </section>

      <section class="machine" aria-label="Video poker game">
        <div id="main-hand" class="main-hand" aria-label="Main hand"></div>

        <div class="status-panel" aria-live="polite">
          <strong id="status-primary">Tap Deal</strong>
          <span id="status-secondary">Trainer Mode</span>
        </div>

        <div class="wager-row">
          <div class="coin-buttons" role="group" aria-label="Coins per hand">
            <button type="button" class="coin-button" data-coins="1">1×</button>
            <button type="button" class="coin-button" data-coins="2">2×</button>
            <button type="button" class="coin-button" data-coins="3">3×</button>
            <button type="button" class="coin-button" data-coins="4">4×</button>
            <button type="button" class="coin-button is-active" data-coins="5">5×</button>
          </div>
          <span id="total-bet" class="total-bet">5 × 10 = 50 credits</span>
        </div>

        <button type="button" id="deal-draw" class="deal-button">Deal — Trainer</button>

        <section id="suggestions-panel" class="suggestions-panel" hidden>
          <div class="section-heading">
            <div>
              <p class="eyebrow">Decision support</p>
              <h2>Suggested holds</h2>
            </div>
            <span id="suggestion-state" class="calculation-state">Estimating</span>
          </div>
          <div id="suggestions" class="suggestions"></div>
          <button type="button" id="exact-button" class="secondary-button">Show exact EV for these holds</button>
        </section>

        <section id="results-panel" class="results-panel" hidden>
          <div class="section-heading">
            <div>
              <p class="eyebrow">Round result</p>
              <h2>Nine hands</h2>
            </div>
            <strong id="round-total" class="round-total">0 credits</strong>
          </div>
          <div id="result-grid" class="result-grid"></div>
        </section>
      </section>

      <footer>
        <button type="button" id="reset-session" class="text-button">Reset session</button>
        <span>Strategy verification pending from Swift v1.9.1</span>
      </footer>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
