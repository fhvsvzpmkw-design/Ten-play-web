<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#062b17" />
    <meta name="description" content="Ten Play 9/6 Jacks or Better video poker trainer and simulator." />
    <title>Ten Play Video Poker</title>
    <link rel="stylesheet" href="./styles.css?v=rich-ui-2" />
    <style>
      .card.is-held {
        border-color: #ffe36b;
        box-shadow: inset 0 0 0 2px rgba(255, 227, 107, 0.6), 0 0 0 4px rgba(242, 201, 76, 0.85), 0 0 16px 7px rgba(242, 201, 76, 0.72), 0 0 38px 14px rgba(242, 201, 76, 0.5);
        z-index: 2;
      }
      .card.is-winning {
        border-color: #67ff9f;
        box-shadow: inset 0 0 0 2px rgba(103, 255, 159, 0.65), 0 0 0 4px rgba(65, 220, 122, 0.9), 0 0 18px 8px rgba(65, 220, 122, 0.78), 0 0 42px 16px rgba(65, 220, 122, 0.55);
        z-index: 3;
      }
      .result-card.is-winning {
        position: relative;
        border-color: #67ff9f;
        box-shadow: inset 0 0 0 1px rgba(103, 255, 159, 0.7), 0 0 0 2px rgba(65, 220, 122, 0.9), 0 0 9px 3px rgba(65, 220, 122, 0.75), 0 0 18px 6px rgba(65, 220, 122, 0.48);
        z-index: 2;
      }
      .card-corner {
        justify-items: start;
        justify-self: start;
        text-align: left;
      }
      .card-corner.bottom {
        justify-items: start;
        justify-self: end;
        text-align: left;
      }
      .brand-title { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
      body { background: radial-gradient(circle at 50% -8%, rgba(83,255,113,.24), transparent 26rem), radial-gradient(circle at 50% 45%, rgba(18,126,62,.28), transparent 34rem), linear-gradient(150deg,#07361d,#03190e 72%); }
      .masthead { position:relative; display:block; width:100%; margin-bottom:.72rem; padding:.42rem; overflow:hidden; border:1px solid rgba(255,218,72,.72); border-radius:1rem; background:radial-gradient(circle at 50% 35%,rgba(75,255,105,.12),transparent 55%),linear-gradient(180deg,rgba(1,28,13,.96),rgba(0,10,5,.98)); box-shadow:inset 0 0 0 1px rgba(101,255,120,.08),inset 0 1px rgba(255,255,255,.05),0 0 26px rgba(88,255,105,.12),0 8px 24px rgba(0,0,0,.28); }
      .masthead::before,.masthead::after { content:""; position:absolute; top:50%; width:12%; height:1px; background:linear-gradient(90deg,transparent,rgba(255,214,66,.82)); box-shadow:0 0 10px rgba(255,214,66,.32); }
      .masthead::before { left:.75rem; } .masthead::after { right:.75rem; transform:scaleX(-1); }
      .brand-logo { display:block; width:100%; height:clamp(5.7rem,13vw,8.2rem); max-width:none; object-fit:cover; object-position:center; border-radius:.72rem; filter:saturate(1.08) contrast(1.06) drop-shadow(0 0 9px rgba(82,255,104,.26)) drop-shadow(0 0 17px rgba(242,201,76,.28)); }
      .masthead .eyebrow { position:absolute; left:.8rem; bottom:.72rem; z-index:3; margin:0; padding:.18rem .5rem; border:1px solid rgba(255,220,85,.45); border-radius:999px; background:rgba(0,19,9,.82); color:#ffe47a; font-size:.61rem; letter-spacing:.13em; box-shadow:0 0 12px rgba(255,214,66,.12); backdrop-filter:blur(5px); }
      .masthead .mode-switch { position:absolute; right:.8rem; bottom:.64rem; z-index:3; }
      .meter-bar,.machine,.suggestion,.result-hand { border-color:rgba(255,221,84,.38); }
      .meter-bar { background:linear-gradient(180deg,rgba(255,255,255,.045),transparent),rgba(0,18,8,.66); box-shadow:inset 0 0 0 1px rgba(77,255,112,.08),0 0 20px rgba(77,255,112,.09); }
      .meter-bar > div { padding:.18rem .4rem; border-radius:.55rem; background:linear-gradient(180deg,rgba(8,58,31,.34),rgba(0,19,9,.15)); }
      .meter-value { color:#fff4b6; text-shadow:0 0 12px rgba(255,214,71,.24); }
      .machine { background:radial-gradient(circle at 50% 0%,rgba(58,173,92,.18),transparent 22rem),linear-gradient(180deg,rgba(255,255,255,.038),transparent 35%),#0a3c22; box-shadow:0 18px 55px rgba(0,0,0,.44),inset 0 0 0 1px rgba(255,214,71,.14),inset 0 1px rgba(255,255,255,.08),0 0 24px rgba(65,220,122,.08); }
      .mode-switch { border-color:rgba(255,221,84,.5); background:linear-gradient(180deg,rgba(0,22,10,.92),rgba(0,10,5,.86)); box-shadow:inset 0 0 0 1px rgba(77,255,112,.09),0 0 14px rgba(77,255,112,.11); }
      .mode-button { transition:transform 120ms ease,box-shadow 120ms ease,background 120ms ease; }
      .mode-button.is-active { background:linear-gradient(180deg,#fff1a0,#e9b72f); color:#1a1300; box-shadow:inset 0 1px rgba(255,255,255,.65),0 0 0 1px rgba(255,213,72,.9),0 0 16px rgba(255,199,55,.32); }
      .coin-button { border-color:rgba(93,255,122,.28); background:linear-gradient(180deg,rgba(8,76,39,.98),rgba(2,39,20,.98)); color:#d6e7d8; box-shadow:inset 0 1px rgba(255,255,255,.06),inset 0 -10px 20px rgba(0,0,0,.16),0 3px 9px rgba(0,0,0,.18); }
      .coin-button.is-active { border-color:#ffdb58; background:linear-gradient(180deg,#ffe67c,#eab328 72%,#cb8d12); color:#261900; box-shadow:inset 0 1px rgba(255,255,255,.68),0 0 0 2px rgba(112,255,119,.32),0 0 18px rgba(255,204,54,.42); transform:translateY(-1px); }
      .deal-button { border:1px solid #ffdb58; background:linear-gradient(180deg,#fff08c 0%,#ffc933 38%,#e9a414 100%); color:#201400; letter-spacing:.035em; text-shadow:0 1px rgba(255,255,255,.35); box-shadow:inset 0 2px rgba(255,255,255,.6),inset 0 -8px 16px rgba(150,82,0,.16),0 0 0 2px rgba(70,255,105,.22),0 8px 20px rgba(0,0,0,.3),0 0 26px rgba(255,198,40,.25); }
      .secondary-button { border-color:rgba(87,255,108,.42); background:linear-gradient(180deg,rgba(8,70,36,.96),rgba(2,35,18,.96)); color:#dff8e1; box-shadow:inset 0 1px rgba(255,255,255,.05),0 0 14px rgba(65,220,122,.08); }
      .status-panel { border-color:rgba(255,221,84,.3); background:linear-gradient(90deg,transparent,rgba(0,0,0,.14),transparent); }
      .status-panel strong { color:#fff5c7; text-shadow:0 0 12px rgba(255,213,72,.2); }
      .suggestion { background:linear-gradient(180deg,rgba(17,86,47,.92),rgba(8,57,31,.94)); box-shadow:inset 0 1px rgba(255,255,255,.035); }
      .suggestion.is-best { border-color:#ffdb58; background:linear-gradient(90deg,rgba(255,209,60,.12),transparent 24%),linear-gradient(180deg,rgba(22,91,49,.96),rgba(8,56,30,.96)); box-shadow:inset 0 0 0 1px rgba(255,221,84,.18),0 0 18px rgba(255,207,53,.16); }
      .result-hand { background:linear-gradient(180deg,rgba(13,70,38,.82),rgba(3,35,18,.9)); box-shadow:inset 0 1px rgba(255,255,255,.04),0 6px 14px rgba(0,0,0,.16); }
      @media (max-width:600px) and (orientation:portrait) {
        .masthead { padding:.34rem; }
        .brand-logo { width:100%; height:5.6rem; max-height:none; object-fit:cover; }
        .masthead .eyebrow { left:.55rem; bottom:.5rem; font-size:.52rem; }
        .masthead .mode-switch { right:.55rem; bottom:.42rem; transform:scale(.88); transform-origin:right bottom; }
      }
    </style>
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <header class="masthead">
        <p class="eyebrow">9/6 Jacks or Better</p>
        <h1 id="app-title" class="brand-title">Vig Wire Labs 10 Play Video Poker</h1>
        <img class="brand-logo" src="./assets/branding/ten-play/logo-primary-wide.png" alt="Vig Wire Labs 10 Play Video Poker" />
        <div class="mode-switch" role="group" aria-label="Display mode">
          <button type="button" class="mode-button is-active" data-mode="trainer">Trainer</button>
          <button type="button" class="mode-button" data-mode="casino">Casino</button>
        </div>
      </header>
      <section class="meter-bar" aria-label="Session totals">
        <div><span class="meter-label">Credits</span><strong id="credits" class="meter-value">1,000</strong></div>
        <div><span class="meter-label">Session RTP</span><strong id="rtp" class="meter-value">0.0%</strong></div>
        <div class="meter-detail"><span>In <b id="total-in">0</b></span><span>Out <b id="total-out">0</b></span></div>
      </section>
      <section class="machine" aria-label="Video poker game">
        <div id="main-hand" class="main-hand" aria-label="Main hand"></div>
        <div class="status-panel" aria-live="polite"><strong id="status-primary">Tap Deal</strong><span id="status-secondary">Trainer Mode</span></div>
        <div class="wager-row">
          <div class="coin-buttons" role="group" aria-label="Coins per hand">
            <button type="button" class="coin-button" data-coins="1">1×</button><button type="button" class="coin-button" data-coins="2">2×</button><button type="button" class="coin-button" data-coins="3">3×</button><button type="button" class="coin-button" data-coins="4">4×</button><button type="button" class="coin-button is-active" data-coins="5">5×</button>
          </div>
          <span id="total-bet" class="total-bet">5 × 10 = 50 credits</span>
        </div>
        <button type="button" id="deal-draw" class="deal-button">Deal — Trainer</button>
        <section id="suggestions-panel" class="suggestions-panel" hidden>
          <div class="section-heading"><div><p class="eyebrow">Decision support</p><h2>Suggested holds</h2></div><span id="suggestion-state" class="calculation-state">Estimating</span></div>
          <div id="suggestions" class="suggestions"></div>
          <button type="button" id="exact-button" class="secondary-button">Show exact EV for these holds</button>
        </section>
        <section id="results-panel" class="results-panel" hidden>
          <div class="section-heading"><div><p class="eyebrow">Round result</p><h2>Ten hands</h2></div><strong id="round-total" class="round-total">0 credits</strong></div>
          <div id="result-grid" class="result-grid"></div>
        </section>
      </section>
      <footer><button type="button" id="reset-session" class="text-button">Reset session</button><span>Strategy verification pending from Swift v1.9.1</span></footer>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
